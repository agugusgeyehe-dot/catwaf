openapi: 3.0.3
info:
  title: CatWAF API
  version: 1.0.1
  description: |
    CatWAF's control-plane API — everything the dashboard itself calls.
    There's no separate "public API" here; this is the real thing the
    frontend uses, documented so you can script against it or build your
    own tooling on top.

    **Scope of this document:** CatWAF has ~167 routes across 19 files.
    This spec covers the core groups in real depth — auth and two-factor
    login, WAF engine settings, custom rules, IP/geo lists, the security
    score, honeypots, sensitive-file protection, operational modes
    (panic/maintenance/config signing), and the settings, protection and
    operations layers — rather than a shallow stub for every endpoint.
    Routes not yet documented here still exist and work; see
    `backend/routes/` for the full list. Expanding this file's coverage is
    tracked in `ROADMAP.md`.

    **The settings layer is self-describing.** Rather than enumerating ~290
    fields here, `GET /api/settings/schema` returns the live schema the
    backend validates against and the dashboard builds its controls from —
    field names, types, defaults, permitted values and help text. That is
    the authoritative reference; `docs/settings.md` is generated from it.

    **One thing worth knowing:** the dashboard stats/traffic endpoints
    (`/api/stats`, `/api/traffic/*`) return real data — sourced from
    Coraza's own audit log via `services/requestLog.js`, not a demo feed —
    but on a fresh install with no real traffic through it yet, that
    honestly means zeros and empty arrays rather than a populated-looking
    dashboard. And
    `/api/security-score` and `/api/security/score` are two URLs for the
    exact same underlying check — kept both for backward compatibility
    after a v3.1 consolidation (see `CHANGELOG.md`).
  license:
    name: MIT
    url: https://github.com/agugusgeyehe-dot/catwaf/blob/main/LICENSE
externalDocs:
  description: Full documentation
  url: https://github.com/agugusgeyehe-dot/catwaf/tree/main/docs

servers:
  - url: http://localhost:8000
    description: Local dev (npm run dev)
  - url: http://localhost:8000
    description: Docker Compose (backend, port published directly)

tags:
  - { name: Auth, description: Login and session handling }
  - { name: WAF Engine, description: Core engine mode, paranoia level, anomaly thresholds, and the general settings bucket }
  - { name: Rules, description: Custom Coraza rules and rule exclusions }
  - { name: Network, description: IP allow/block lists and geo-blocking }
  - { name: Security Score, description: The dashboard's Security page — an honest, state-derived posture score }
  - { name: Honeypot, description: Decoy paths that catch automated scanning }
  - { name: Sensitive Files, description: Blocking access to files that shouldn't be publicly reachable }
  - { name: Modes, description: Panic mode, maintenance mode, and configuration signing }
  - { name: Dashboard, description: Stats, traffic charts, logs, and audit trail }
  - { name: Settings, description: The declarative settings layer — read, validate, preview and apply any group }
  - { name: Protection, description: Active bans, the challenge gate, behavioural banning and threat intelligence }
  - { name: Operations, description: Scheduled jobs, backups, caches, templates, reports, telemetry and metrics }
  - { name: TLS, description: Certificate status and validation }
  - { name: Plugins, description: The data-only plugin format }
  - { name: Applications, description: 'Discovering web applications on this host and putting CatWAF in front of them: DISCOVER -> GENERATE -> APPLY -> VERIFY' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Obtained from POST /api/auth/login. Unauthenticated requests are
        still accepted for GET routes (treated as the built-in `guest`/
        viewer role) — the token only matters for anything that mutates
        state, which requires the `admin` role.

  responses:
    Unauthorized:
      description: Read-only role — log in as admin to modify this.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Validation failed — the request body or params didn't pass checks.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No matching resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Login rate limit exceeded (10 attempts / 5 minutes per IP+username).
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until the limit resets }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        detail: { type: string, example: 'Read-only role. Log in as admin to modify.' }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, format: password, example: admin }

    LoginResponse:
      type: object
      properties:
        token: { type: string, description: 'JWT — send as `Authorization: Bearer <token>` on subsequent requests' }
        user:
          type: object
          properties:
            id: { type: string }
            username: { type: string }
            role: { type: string, enum: [admin, viewer] }

    IpListEntry:
      type: object
      properties:
        ip: { type: string, example: 203.0.113.7 }
        note: { type: string }
        added_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }

    AddIpRequest:
      type: object
      required: [ip, list]
      properties:
        ip: { type: string, description: 'IPv4/IPv6 address or CIDR range', example: 203.0.113.7 }
        list: { type: string, enum: [whitelist, blacklist] }
        note: { type: string, maxLength: 256 }
        ttl_minutes: { type: integer, description: Auto-expire this entry after N minutes. Omit for a permanent entry. }

    CustomRule:
      type: object
      required: [value, name]
      properties:
        id: { type: string }
        variable: { type: string, description: 'Coraza variable, e.g. ARGS, REQUEST_URI, REQUEST_HEADERS:User-Agent', default: ARGS }
        operator: { type: string, enum: [contains, streq, beginsWith, endsWith, rx, pm, eq, ge, le, gt, lt], default: contains }
        value: { type: string, maxLength: 512 }
        name: { type: string, maxLength: 128, description: Used as the rule's msg field }
        action: { type: string, enum: [deny, pass, allow, drop, log, block], default: deny }
        phase: { type: integer, minimum: 1, maximum: 5, default: 2 }
        enabled: { type: boolean, default: true }

    WafSettings:
      type: object
      description: The subset of WAF state this endpoint allows reading/writing — see the SETTING_KEYS allow-list in routes/waf.js.
      properties:
        allowed_methods: { type: array, items: { type: string }, example: [GET, POST, HEAD, OPTIONS] }
        allowed_content_types: { type: array, items: { type: string } }
        max_request_body_size: { type: number }
        max_file_upload_size: { type: number }
        request_body_inspection: { type: boolean }
        response_body_inspection: { type: boolean }
        audit_log: { type: boolean }
        enforce_bodyproc_urlencoded: { type: boolean }
        early_blocking: { type: boolean }
        sampling_percentage: { type: number, minimum: 0, maximum: 100 }
        blocked_user_agents: { type: array, items: { type: string }, example: [sqlmap, nikto, nmap] }
        header_rules: { type: array, items: { type: object } }

    SecurityScoreCheck:
      type: object
      properties:
        id: { type: string }
        category: { type: string }
        weight: { type: integer }
        status: { type: string, enum: [pass, warn, fail, unknown] }
        label: { type: string }
        detail: { type: string }
        recommendation: { type: string, nullable: true }

    SecurityScore:
      type: object
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        grade: { type: string, enum: [A, B, C, D, F] }
        checks: { type: array, items: { $ref: '#/components/schemas/SecurityScoreCheck' } }
        by_category:
          type: object
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/SecurityScoreCheck' }
        passing: { type: integer }
        warnings: { type: integer }
        critical_failures: { type: integer }
        total_checks: { type: integer }
        recommendations:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              recommendation: { type: string }
              severity: { type: string, enum: [high, medium, low] }
        computed_at: { type: string, format: date-time }

    HoneypotPath:
      type: object
      properties:
        path: { type: string, example: /wp-admin/install.php }
        label: { type: string }
        enabled: { type: boolean }

    AppliedRoute:
      type: object
      description: One route in CatWAF's generated region of the live Caddyfile.
      properties:
        name: { type: string }
        runtime: { type: string, nullable: true, description: 'Detected runtime, e.g. "PHP 8.3"' }
        containerName: { type: string, nullable: true }
        listenPort: { type: integer, description: Port CatWAF listens on for this application }
        upstream: { type: string, nullable: true, description: Address CatWAF forwards to once a request passes the WAF }

    DiscoveredApp:
      type: object
      description: >
        The safe projection of a discovered container. Raw environment and
        labels are deliberately absent — see backend/services/discovery/summary.js.
      properties:
        name: { type: string, description: Compose service name where there is one, otherwise the container name }
        containerName: { type: string }
        image: { type: string }
        running: { type: boolean }
        isWeb: { type: boolean, description: Whether this serves HTTP and is therefore routable }
        webServer: { type: string, nullable: true }
        webServerConfidence: { type: number, nullable: true }
        runtime: { type: string, nullable: true }
        framework: { type: string, nullable: true }
        port: { type: integer, nullable: true }
        published: { type: boolean, description: Published to the host — such a port bypasses CatWAF while it stays published }
        reachability: { type: string, nullable: true }
        networks: { type: array, items: { type: string } }
        phpConfidence: { type: number, nullable: true }
        fastcgiBackend: { type: string, nullable: true }
        fpmBackendFor: { type: array, nullable: true, items: { type: string } }
        incomplete: { type: boolean }
        evidence:
          type: object
          description: Why CatWAF classified it this way. Files, processes, ports and config directives — never secret values.
          properties:
            web: { type: array, items: { type: string } }
            php: { type: array, items: { type: string } }
            runtime: { type: array, items: { type: string } }
            server: { type: array, items: { type: string } }

    VerificationResult:
      type: object
      properties:
        name: { type: string }
        protected: { type: boolean, description: True only when a benign request was served AND a CRS payload was refused }
        reason: { type: string, nullable: true, description: Why the route is not protected }
        benignStatus: { type: integer, nullable: true }
        attackStatus: { type: integer, nullable: true }
        upstreamUnreachable: { type: boolean, description: 'CatWAF is listening but the application behind it is down — the site is broken, not merely unprotected' }
        wafBypassed: { type: boolean, description: 'A CRS payload reached the application, so Coraza is not inspecting this route' }

    Verification:
      type: object
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/VerificationResult' } }
        protectedCount: { type: integer }
        allProtected: { type: boolean }

    ProtectResult:
      type: object
      properties:
        ok: { type: boolean }
        stage:
          type: string
          description: How far the pipeline got.
          enum: [discovery, plan, dry-run, apply, applied, unverified, protected]
        dry_run: { type: boolean }
        error: { type: string, nullable: true }
        message: { type: string, nullable: true }
        containers: { type: array, items: { $ref: '#/components/schemas/DiscoveredApp' } }
        web_apps: { type: array, items: { $ref: '#/components/schemas/DiscoveredApp' } }
        routes: { type: array, items: { $ref: '#/components/schemas/AppliedRoute' } }
        skipped:
          type: array
          description: Applications CatWAF found but could not route to, with diagnostics.
          items:
            type: object
            properties:
              name: { type: string }
              reason: { type: string }
              diagnostics: { type: array, items: { type: string } }
        backup: { type: string, nullable: true, description: Path the previous Caddyfile was copied to }
        reloaded: { type: boolean, nullable: true }
        reload_error: { type: string, nullable: true }
        verification: { allOf: [{ $ref: '#/components/schemas/Verification' }], nullable: true }
        protected:
          type: boolean
          description: >
            Derived solely from `verification.allProtected`. A generated,
            applied and cleanly reloaded configuration does not set this.

    PanicState:
      type: object
      properties:
        active: { type: boolean }
        activated_at: { type: string, format: date-time, nullable: true }
        activated_by: { type: string, nullable: true }
        prior_state: { type: object, nullable: true, description: 'WAF settings snapshot to restore on deactivate' }

paths:

  # ─── Applications ───────────────────────────────────────────────────────
  #
  # A thin transport over backend/services/discovery/ and
  # backend/services/proxy/ — the same pipeline `catwaf auto` runs. The
  # contract that matters: only POST /api/apps/verify (and the `verification`
  # block a protect run returns) may be read as proof of protection. An
  # applied configuration is not protection, and nothing here reports it as
  # such.

  /api/apps:
    get:
      tags: [Applications]
      summary: Routes CatWAF has applied, read back from the live Caddyfile
      description: >
        Side-effect free, safe to poll. Reports what is *configured*. `hasRegion`
        distinguishes "no generated region in the Caddyfile" from "CatWAF could
        not read the Caddyfile at all", which `ok: false` reports instead.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, description: false when the Caddyfile could not be read }
                  error: { type: string, nullable: true }
                  caddyfile: { type: string, description: Path that was read }
                  hasRegion: { type: boolean, description: Whether CatWAF's generated region exists }
                  caddy_running: { type: boolean }
                  busy: { type: string, nullable: true, description: Name of a pipeline run in progress, if any }
                  routes:
                    type: array
                    items: { $ref: '#/components/schemas/AppliedRoute' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/apps/discover:
    post:
      tags: [Applications]
      summary: Inspect this host for web applications (OBSERVE -> CORRELATE -> CLASSIFY)
      description: >
        Writes nothing. Answers 200 with `ok: false` and a reason when the host
        cannot be inspected (no Docker daemon, no permission) — that is an
        outcome, not a transport error. Container environment variables and
        labels are never returned: they routinely hold database passwords.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                skip_http_probe:
                  type: boolean
                  default: false
                  description: Skip the per-port HTTP probe. Faster, but "a port is open" is then not confirmed to be "a port serving HTTP".
      responses:
        '200':
          description: Discovery ran, or explained why it could not
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  code: { type: string, description: Machine-readable reason when ok is false }
                  detail: { type: string, description: Human-readable reason when ok is false }
                  containers: { type: array, items: { $ref: '#/components/schemas/DiscoveredApp' } }
                  web_apps: { type: array, items: { $ref: '#/components/schemas/DiscoveredApp' } }
                  errors:
                    type: array
                    description: Containers that could not be inspected; the rest of the scan still completed.
                    items:
                      type: object
                      properties: { name: { type: string }, error: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Another pipeline run is already in progress. }

  /api/apps/preview:
    post:
      tags: [Applications]
      summary: The routes a protect run would create — nothing is written
      description: >
        A full dry run: discovery, upstream resolution and route planning, with
        no file written, no reload, and no port assignment persisted. `protected`
        is always false here by construction.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ProtectResult' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Another pipeline run is already in progress. }

  /api/apps/protect:
    post:
      tags: [Applications]
      summary: Apply the generated configuration, reload, then verify with real traffic
      description: >
        Admin only, and audited. Rewrites CatWAF's generated region, backs up the
        previous Caddyfile, reloads, then proves the result with a real benign
        request and a real inert CRS payload against each route.


        Unlike `catwaf auto`, this never starts the proxy: that is a privileged
        host action. If Caddy is not running the response reports the routes as
        applied but not live, rather than trying to start services.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                skip_verify:
                  type: boolean
                  default: false
                  description: Apply without verifying. `protected` is then false, because nothing was proven.
      responses:
        '200':
          description: The pipeline ran; read `stage`, `verification` and `protected` for the outcome.
          content: { application/json: { schema: { $ref: '#/components/schemas/ProtectResult' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Read-only role. }
        '409': { description: Another pipeline run is already in progress. }

  /api/apps/verify:
    post:
      tags: [Applications]
      summary: Prove protection with real requests
      description: >
        Sends two real requests to each applied route: a benign one that must be
        served, and the standard inert OWASP CRS SQL-injection signature that
        must be refused. A route is `protected` only if both hold. This is the
        only endpoint whose answer may be presented to a user as "protected".
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  detail: { type: string, description: Present when there is nothing applied to verify }
                  routes: { type: array, items: { $ref: '#/components/schemas/AppliedRoute' } }
                  verification: { $ref: '#/components/schemas/Verification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Another pipeline run is already in progress. }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: Rate limited to 10 attempts per 5 minutes, keyed by IP + username.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/waf/engine:
    get:
      tags: [WAF Engine]
      summary: Get current engine mode
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { mode: { type: string, enum: [On, DetectionOnly, Off] } } } } } }
    post:
      tags: [WAF Engine]
      summary: Set engine mode
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [mode], properties: { mode: { type: string, enum: [On, DetectionOnly, Off] } } } } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/waf/paranoia:
    get:
      tags: [WAF Engine]
      summary: Get current paranoia level (PL1-PL4)
      responses:
        '200': { description: OK }
    post:
      tags: [WAF Engine]
      summary: Set paranoia level
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [level], properties: { level: { type: integer, enum: [1, 2, 3, 4] } } } } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/waf/settings:
    get:
      tags: [WAF Engine]
      summary: Get general WAF settings
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WafSettings' } } } }
    patch:
      tags: [WAF Engine]
      summary: Update WAF settings (no Caddy reload)
      description: >
        Only accepts keys in the WafSettings schema — this endpoint used to
        accept any key present on internal WAF state at all (a mass-assignment
        bug fixed in v3.0.1; see CHANGELOG.md), which let a single request
        here silently bypass every other route's validation. Fixed now.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WafSettings' } } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [WAF Engine]
      summary: Update WAF settings and reload Caddy
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WafSettings' } } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/rules/custom:
    get:
      tags: [Rules]
      summary: List custom rules
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CustomRule' } } } } }
    post:
      tags: [Rules]
      summary: Add a custom rule
      description: >
        variable/operator/action/phase are validated against allow-lists;
        value/name are free text (escaped before being written into the
        live Caddyfile — see the config-injection fix in CHANGELOG.md v3.0.1).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomRule' } } }
      responses:
        '200': { description: Added }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/rules/custom/{rule_id}:
    delete:
      tags: [Rules]
      summary: Delete a custom rule
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: rule_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Removed }
        '403': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/ip/whitelist:
    get:
      tags: [Network]
      summary: List whitelisted IPs (expired TTL entries pruned on read)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IpListEntry' } } } } }

  /api/ip/blacklist:
    get:
      tags: [Network]
      summary: List blacklisted IPs (expired TTL entries pruned on read)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IpListEntry' } } } } }

  /api/ip/add:
    post:
      tags: [Network]
      summary: Add an IP or CIDR range to a list
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddIpRequest' } } }
      responses:
        '200': { description: Added }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/ip/{list}/{ip}:
    delete:
      tags: [Network]
      summary: Remove an IP from a list
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: list, in: path, required: true, schema: { type: string, enum: [whitelist, blacklist] } }
        - { name: ip, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/geo:
    get:
      tags: [Network]
      summary: List blocked country codes
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { blocked_countries: { type: array, items: { type: string } } } } } } }

  /api/geo/{cc}:
    post:
      tags: [Network]
      summary: Toggle geo-blocking for a country
      description: cc must be a 2-letter ISO country code (case-insensitive; normalized to uppercase).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cc, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z]{2}$' } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/security/score:
    get:
      tags: [Security Score]
      summary: Get the current security posture score
      description: >
        Computed live from actual configuration. Checks CatWAF can't verify
        (e.g. origin TLS without a Cloudflare connection) are marked
        `unknown` rather than guessed. See services/securityScore.js.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityScore' } } } }

  /api/security-score:
    get:
      tags: [Security Score]
      summary: Get the current security posture score (legacy path)
      description: Identical response to GET /api/security/score — kept for backward compatibility. See the "Correction" note in CHANGELOG.md.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityScore' } } } }

  /api/honeypot/paths:
    post:
      tags: [Honeypot]
      summary: Add a custom decoy path
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [path], properties: { path: { type: string, example: /admin/backup.zip }, label: { type: string, maxLength: 128 } } } } }
      responses:
        '200': { description: Added }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/honeypot/paths/{path}:
    delete:
      tags: [Honeypot]
      summary: Remove a decoy path
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Removed }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/honeypot/toggle:
    post:
      tags: [Honeypot]
      summary: Enable or disable the honeypot system entirely
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/sensitive/blocked:
    get:
      tags: [Sensitive Files]
      summary: List manually blocked paths
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { blocked: { type: array, items: { type: string } } } } } } }

  /api/sensitive/block:
    post:
      tags: [Sensitive Files]
      summary: Manually block a path
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [path], properties: { path: { type: string, example: /.env } } } } }
      responses:
        '200': { description: Blocked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/panic-mode:
    get:
      tags: [Modes]
      summary: Get panic mode status
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PanicState' } } } }

  /api/panic-mode/activate:
    post:
      tags: [Modes]
      summary: Activate panic mode (PL4, engine On, anomaly thresholds tightened to 2, 100% sampling)
      description: Snapshots current settings first so /api/panic-mode/deactivate can restore them exactly.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Activated }
        '400': { description: Already active }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/panic-mode/deactivate:
    post:
      tags: [Modes]
      summary: Deactivate panic mode and restore the pre-panic settings snapshot
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Deactivated }
        '400': { description: Not currently active }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/config/sign:
    post:
      tags: [Modes]
      summary: Sign the current WAF configuration (SHA-256 of WAF + rule-category state)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Signed }
        '403': { $ref: '#/components/responses/Unauthorized' }

  /api/config/verify:
    get:
      tags: [Modes]
      summary: Check whether the current config matches its last signature
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  signed: { type: boolean }
                  tampered: { type: boolean, nullable: true }
                  signature: { type: object, nullable: true }
                  current_hash: { type: string }

  /api/health:
    get:
      tags: [Dashboard]
      summary: Basic health check
      responses:
        '200': { description: OK }

  /api/stats:
    get:
      tags: [Dashboard]
      summary: Dashboard summary stats
      description: 'Real data, sourced from Coraza''s own audit log via services/requestLog.js — not a demo feed. On a fresh install with no real traffic yet, counts are honestly 0 rather than populated-looking placeholder numbers.'
      responses:
        '200': { description: OK }

  /api/audit:
    get:
      tags: [Dashboard]
      summary: Real audit trail of admin actions
      description: Unlike /api/stats, this is real — every write action across the app calls auditSvc.audit() and lands here.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 200 } }
      responses:
        '200': { description: OK }

  # ─── Settings layer ────────────────────────────────────────────────────

  /api/settings/schema:
    get:
      tags: [Settings]
      summary: The live settings schema
      description: >
        Every group and field the backend validates against, with types,
        defaults, permitted values and help text. The dashboard builds its
        controls from this at runtime, so a setting added to the schema
        appears in the UI with no matching frontend change. Secret fields are
        marked write_only and their values are never included.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /api/settings:
    get:
      tags: [Settings]
      summary: Every group's current values, redacted
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /api/settings/{group}:
    parameters:
      - { name: group, in: path, required: true, schema: { type: string }, description: 'A group name from /api/settings/schema, e.g. access, challenge, tls' }
    get:
      tags: [Settings]
      summary: One group's schema and current values
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '404': { description: Unknown settings group }
    patch:
      tags: [Settings]
      summary: Change one or more fields in a group
      description: >
        Validated, written, rendered into the Caddyfile and validated by Caddy
        before anything is applied. If the result would not load, the previous
        configuration is kept and the response describes which phase failed.
        The response includes render_report.skipped — settings that are on but
        could not be rendered, usually because the installed Caddy lacks an
        optional module.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Applied }
        '400': { description: Validation failed, or the rendered configuration was rejected and rolled back }
        '404': { description: Unknown settings group }

  /api/settings/{group}/preview:
    parameters:
      - { name: group, in: path, required: true, schema: { type: string } }
    post:
      tags: [Settings]
      summary: Diff the Caddyfile this change would produce, without applying it
      description: >
        Runs the same mutate-and-render pipeline as PATCH, stops before
        validation and reload, diffs the two rendered Caddyfiles, then restores
        state. Nothing is written. render_report.newly_skipped names anything
        the change would enable that could not actually take effect.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: OK }
        '400': { description: Validation failed }

  /api/settings/{group}/reset:
    parameters:
      - { name: group, in: path, required: true, schema: { type: string } }
    post:
      tags: [Settings]
      summary: Restore a group's defaults
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Reset }

  /api/config/render-report:
    get:
      tags: [Settings]
      summary: What was left out of the generated configuration, and why
      description: >
        Settings that are switched on but could not be rendered — a missing
        optional Caddy module or an unmet prerequisite. CatWAF skips such a
        directive rather than emitting one Caddy would reject, which would take
        the site down; this endpoint is how that decision is surfaced instead
        of being a silent no-op.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  # ─── Protection ────────────────────────────────────────────────────────

  /api/bans:
    get:
      tags: [Protection]
      summary: Every address currently being refused
      description: >
        The unified ban store. Behavioural banning, DNSBL hits, the challenge
        gate, community lists, the threat feed and the shared network all write
        here. The manual IP blocklist is separate and is not included.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: source, in: query, schema: { type: string }, description: Filter to one ban source }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: include_expired, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: OK }
    post:
      tags: [Protection]
      summary: Ban an address or range by hand
      description: >
        Refuses a range covering the caller's own address — banning it would
        lock the administrator out of the dashboard. Omit seconds for a
        permanent ban.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string, description: IP address or CIDR range }
                seconds: { type: integer, nullable: true, description: 'Duration; null means permanent' }
                reason: { type: string }
      responses:
        '200': { description: Banned }
        '400': { description: 'Invalid target, or code SELF_BLOCK when the range covers the caller' }

  /api/bans/{id}:
    delete:
      tags: [Protection]
      summary: Lift one ban
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Lifted }
        '404': { description: No such ban }

  /api/bans/lift:
    post:
      tags: [Protection]
      summary: Lift every ban on an address, across sources
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [target], properties: { target: { type: string }, source: { type: string, nullable: true } } } } }
      responses:
        '200': { description: OK }

  /api/bans/clear:
    post:
      tags: [Protection]
      summary: Lift every automatic ban
      description: The manual IP blocklist is unchanged.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /api/protect/test:
    post:
      tags: [Protection]
      summary: Run the real classification pipeline against a supplied address
      description: >
        Answers "why would this visitor be treated the way they are" without
        waiting for them to visit. Returns the verdict and every signal that
        contributed, including sources that were unavailable and why.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ip], properties: { ip: { type: string }, uri: { type: string, default: '/' }, user_agent: { type: string } } } } }
      responses:
        '200': { description: OK }
        '400': { description: Not a valid IP address }

  /api/protect/behavior:
    get:
      tags: [Protection]
      summary: Dry run — who behavioural banning would catch right now
      description: >
        Read from the real request log with the configured thresholds. Worth
        checking before enabling the feature: a legitimate client that 404s a
        lot is indistinguishable from a scanner by this measure.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /api/challenge/preview:
    get:
      tags: [Protection]
      summary: The real challenge page, issued by the real issuer
      description: Returns HTML, not JSON. Fails with 400 when the gate is switched off.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { text/html: { schema: { type: string } } } }
        '400': { description: The challenge gate is off, so there is nothing to preview }

  /api/challenge/scope-test:
    post:
      tags: [Protection]
      summary: Would this request be challenged?
      description: Runs the real scoping rules — exemptions, paths, country, user agent — against a hypothetical request.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { ip: { type: string }, uri: { type: string }, user_agent: { type: string }, country: { type: string, nullable: true }, suspicious: { type: boolean } } } } }
      responses:
        '200': { description: OK }

  /api/intel/lists:
    get:
      tags: [Protection]
      summary: Subscribed community blocklists and their entry counts
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /api/intel/probe/tradeoffs:
    get:
      tags: [Protection]
      summary: The costs of active client probing, stated verbatim
      description: >
        Client probing opens a TCP connection back to the visitor. Some
        networks treat that as port scanning and will file an abuse report.
        This text is surfaced next to the toggle so enabling it is a decision
        rather than a surprise.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  # ─── Operations ────────────────────────────────────────────────────────

  /api/jobs:
    get:
      tags: [Operations]
      summary: Every scheduled job, its interval and its last run
      description: A job whose feature is switched off is listed but never scheduled.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /api/jobs/{name}/run:
    post:
      tags: [Operations]
      summary: Run one job now, regardless of its schedule
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Finished }
        '404': { description: No such job }
        '500': { description: The job ran and failed }

  /api/caches:
    get:
      tags: [Operations]
      summary: Cache namespaces, entry counts and sizes
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /api/caches/{id}/clear:
    post:
      tags: [Operations]
      summary: Empty one namespace ("all" empties every namespace)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cleared }

  /api/templates:
    get:
      tags: [Operations]
      summary: Built-in and saved configuration templates
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Operations]
      summary: Save the current configuration as a template
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, groups: { type: array, items: { type: string }, nullable: true }, include_waf: { type: boolean, default: true }, description: { type: string } } } } }
      responses:
        '200': { description: Saved }

  /api/templates/{id}/apply:
    post:
      tags: [Operations]
      summary: Apply a template, or show what it would change
      description: >
        Send dry_run true first. Applying rewrites several settings groups at
        once, which is exactly the change worth reading before it happens.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content: { application/json: { schema: { type: object, properties: { dry_run: { type: boolean, default: false } } } } }
      responses:
        '200': { description: 'Applied, or the change list when dry_run is true' }

  /api/reports:
    get:
      tags: [Operations]
      summary: Activity over a date range
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv, events-csv, html], default: json } }
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { type: object } }
            text/csv: { schema: { type: string } }
            text/html: { schema: { type: string } }

  /api/backups:
    get:
      tags: [Operations]
      summary: Stored backups and the configured destination
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /api/backups/run:
    post:
      tags: [Operations]
      summary: Write a backup now
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { dry_run: { type: boolean }, destination: { type: string, nullable: true } } } } }
      responses:
        '200': { description: OK }

  /api/telemetry:
    get:
      tags: [Operations]
      summary: Telemetry status and the exact payload that would be sent
      description: >
        payload_preview is the real payload built from this install right now,
        not an illustration of one. never_collected states what is excluded.
        Telemetry is off unless explicitly enabled.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /metrics:
    get:
      tags: [Operations]
      summary: Prometheus scrape endpoint
      description: >
        Off by default. Mounted outside the rotating admin path because a
        scraper needs a fixed URL, and guarded by both a bearer token and a
        source-CIDR allowlist — a scrape must satisfy both. See docs/metrics.md.
      responses:
        '200': { description: OK, content: { text/plain: { schema: { type: string } } } }
        '401': { description: Missing or wrong token }
        '403': { description: Scrape source is not in allow_cidrs }
        '404': { description: Metrics are disabled }

  # ─── TLS ───────────────────────────────────────────────────────────────

  /api/tls/status:
    get:
      tags: [TLS]
      summary: Certificates Caddy holds, ACME advice, and Caddy's capabilities
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /api/tls/validate:
    post:
      tags: [TLS]
      summary: Inspect a certificate, or check a certificate and key match
      description: >
        A mismatched certificate and key does not fail at apply time — it fails
        when a visitor tries to connect. Check first.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { certificate: { type: string }, key: { type: string }, ca: { type: string } } } } }
      responses:
        '200': { description: 'Inspection result; ok is false with an error when the certificate is unusable' }

  # ─── Two-factor login ──────────────────────────────────────────────────

  /api/auth/2fa:
    get:
      tags: [Auth]
      summary: Whether two-factor is enabled for the current account
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }

  /api/auth/2fa/enroll:
    post:
      tags: [Auth]
      summary: Begin enrollment
      description: >
        Returns the secret and an otpauth:// URI. Nothing is enforced until
        /confirm proves the authenticator app works — enrolling without that
        check is how people lock themselves out.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '400': { description: Already enabled }

  /api/auth/2fa/confirm:
    post:
      tags: [Auth]
      summary: Prove the authenticator works and turn two-factor on
      description: >
        Returns ten recovery codes, once. They are stored as HMACs, so this
        response cannot be reproduced later. The code used here is spent by
        the confirmation and cannot then be used to log in.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        '200': { description: Enabled }
        '400': { description: Wrong or expired code }

  /api/auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Turn two-factor off
      description: Re-checks the password — disabling a second factor is exactly what a stolen session would attempt.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } }
      responses:
        '200': { description: Disabled }
        '401': { description: Password confirmation failed }

  # ─── Plugins ───────────────────────────────────────────────────────────

  /api/plugins:
    get:
      tags: [Plugins]
      summary: Installed plugins, and the policy they are held to
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Plugins]
      summary: Install a plugin manifest
      description: >
        Plugins are data only. A manifest declaring code, script, main,
        require, exec, command, hooks, middleware, entry or eval is refused
        rather than ignored, so a plugin written against a nonexistent
        execution API fails loudly instead of appearing to work.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [catwaf_plugin, id], additionalProperties: true } } }
      responses:
        '200': { description: Installed }
        '400': { description: The manifest was refused; detail says why }
