<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CatWAF — Admin Login</title>
<style>
  :root {
    --bg: #000000;
    --card: #111111;
    --border: #2a2a2a;
    --text: #ffffff;
    --sub: #7a7a7a;
    --accent: #d0d0d0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 340px;
  }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; justify-content: center; }
  .logo img { width: 36px; height: 36px; }
  .logo h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 6px; }
  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--text);
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  .field { margin-bottom: 14px; }
  .field.hidden { display: none; }
  button {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
  }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    display: none;
    background: #2a1214;
    border: 1px solid #5c1f24;
    color: #ff9ca3;
    font-size: 12px;
    border-radius: 8px;
    padding: 9px 12px;
    margin-bottom: 14px;
  }
  .hint { font-size: 11px; color: var(--sub); text-align: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<div class="panel">
  <div class="logo">
    <img src="/assets/logo/catwaf-icon-256.png" alt="">
    <h1 id="title">CatWAF Admin</h1>
  </div>
  <div class="error" id="err"></div>
  <form id="form">
    <div class="field" id="field-user">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="field" id="field-pass">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="field hidden" id="field-totp">
      <label for="totp">Two-factor code</label>
      <input id="totp" name="totp" inputmode="numeric" autocomplete="one-time-code"
             placeholder="000000" style="text-align:center;letter-spacing:.28em;font-family:monospace;">
    </div>
    <button type="submit" id="btn">Sign in</button>
  </form>
  <div class="hint">No account yet? Run <code>catwaf --setup</code> on the server.</div>
</div>

<script src="/login.js" defer></script>
</body>
</html>
