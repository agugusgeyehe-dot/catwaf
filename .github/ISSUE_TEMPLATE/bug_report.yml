name: Bug report
description: Something in CatWAF does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        If this is a security vulnerability, close this and follow SECURITY.md
        instead. Please do not paste secrets: `catwaf doctor` output is safe to
        share, raw `.env` files and Cloudflare tokens are not.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what CatWAF did instead.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `catwaf doctor`
      description: >-
        This reports the Caddy build, whether the Coraza module is present,
        the CRS version and the state of the config — most reports are
        diagnosed from it alone.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CatWAF version
      placeholder: "1.0.1"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Operating system and Node version
      placeholder: "Ubuntu 24.04, Node 22.11"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How is CatWAF installed?
      options:
        - setup.sh on the host
        - Docker / docker compose
        - From source
        - Other
    validations:
      required: true
