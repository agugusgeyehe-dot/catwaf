# nginx front end for the split PHP-FPM fixture.
#
# The `fastcgi_pass freshmart_php:9000` line below is the exact signal
# discovery/fastcgi.js correlates on: it names the PHP-FPM container by a
# name Docker's embedded DNS resolves, rather than by IP.

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass freshmart_php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
