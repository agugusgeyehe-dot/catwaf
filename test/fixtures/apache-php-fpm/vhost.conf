# Apache vhost for the split PHP-FPM fixture.
#
# `ProxyPassMatch ... fcgi://booknook_php:9000` is the exact signal
# discovery/fastcgi.js correlates on: it names the PHP-FPM container by a
# name Docker's embedded DNS resolves, rather than by IP.

ServerName booknook.local

<VirtualHost *:80>
    DocumentRoot "/var/www/html"

    ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://booknook_php:9000/var/www/html/$1

    <Directory "/var/www/html">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>
</VirtualHost>
